<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class = "container bg-dark p-5">
        <h1 class = "text-white text-center">My Notes:</h1>
    </div>
    <br>
    <div class = "container bg-light p-2 rounded-2" id = "new-note">
        <form action = "/add" method = "post">
            <div class = "mb-3">
                <label for = "note" class = "form-label"><strong>NEW NOTE:</strong></label>
                <textarea name = "note" class = "form-control" id = "note" rows = "3"></textarea>
            </div>
            <button name = "save_note" type = "submit" class = "btn btn-sm btn-primary mb-3"><strong>SUBMIT</strong></button>
        </form>
    </div>
    <br>
    <div class = "container p-0 rounded-2" id = "notes">
        <h5 class = "text-black">PREVIOUS NOTES:</h5>
        {%for note in notes%}
            <div class = "card bg-light mb-3">
                <div class = "card-header text-end"><a href = "/delete/{{note['_id']}}"class = "btn btn-sm btn-danger"><strong>X</strong></a></div>
                <div class = "card-body">
                    <h5 class = "card-title">{{note["note"]}}</h5>
                </div>
                <div class = "card-footer bg-transparent">Posted at: {{note["timestamp"]}}</div>
            </div>
        {%endfor%}
    </div>
</body>
</html>
